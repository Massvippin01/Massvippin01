<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#030814"/>
      <stop offset="1" stop-color="#0b1f45"/>
    </linearGradient>
    <style>
      .s { fill:#bfdbfe; animation: tw 3s ease-in-out infinite; }
      .d2 { animation-delay: 1.2s; } .d3 { animation-delay: 2.1s; }
      @keyframes tw { 0%,100% { opacity:.2 } 50% { opacity:.9 } }
      .q { font: italic 18px Georgia, 'Times New Roman', serif; fill:#cbd5e1; }
      .m { font: 13px Consolas, 'Courier New', monospace; fill:#475569; letter-spacing:3px; }
    </style>
  </defs>
  <rect width="1200" height="140" fill="url(#g)"/>
  <circle class="s" cx="90" cy="30" r="1.2"/><circle class="s d2" cx="260" cy="100" r="1"/>
  <circle class="s d3" cx="400" cy="40" r="1.3"/><circle class="s" cx="820" cy="110" r="1"/>
  <circle class="s d2" cx="960" cy="35" r="1.4"/><circle class="s d3" cx="1110" cy="90" r="1"/>
  <text x="600" y="66" text-anchor="middle" class="q">“First, solve the problem. Then, write the code.”</text>
  <text x="600" y="100" text-anchor="middle" class="m">— END OF TRANSMISSION —</text>
</svg>
