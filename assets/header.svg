<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <radialGradient id="sky" cx="72%" cy="30%" r="90%">
      <stop offset="0" stop-color="#0f2a5c"/>
      <stop offset="0.45" stop-color="#081633"/>
      <stop offset="1" stop-color="#030814"/>
    </radialGradient>
    <radialGradient id="nebula" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tail" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="140" y2="-70">
      <stop offset="0" stop-color="#e0f2fe" stop-opacity="1"/>
      <stop offset="0.3" stop-color="#60a5fa" stop-opacity=".6"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <style>
      .s { fill:#dbeafe; animation: tw 3s ease-in-out infinite; }
      .s2 { animation-delay: 1s; } .s3 { animation-delay: 2s; }
      @keyframes tw { 0%,100% { opacity:.25 } 50% { opacity:1 } }
      .shoot { opacity:0; animation: fall 9s linear infinite; }
      @keyframes fall {
        0%   { opacity:0; transform: translate(calc(1150px + var(--x,0px)), calc(-20px + var(--y,0px))); }
        2%   { opacity:1; }
        12%  { opacity:0; transform: translate(calc(700px + var(--x,0px)), calc(205px + var(--y,0px))); }
        100% { opacity:0; transform: translate(calc(700px + var(--x,0px)), calc(205px + var(--y,0px))); }
      }
      .name { font: 700 64px 'Segoe UI', Helvetica, Arial, sans-serif; fill:#f8fafc; letter-spacing:1px; }
      .role { font: 500 20px 'Segoe UI', Helvetica, Arial, sans-serif; fill:#93c5fd; letter-spacing:4px; }
      .mono { font: 15px Consolas, 'Courier New', monospace; fill:#64748b; }
      .cur { fill:#22d3ee; animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity:0 } }
    </style>
  </defs>

  <rect width="1200" height="340" fill="url(#sky)"/>
  <ellipse cx="880" cy="140" rx="380" ry="200" fill="url(#nebula)"/>

  <!-- stars -->
  <g>
    <circle class="s" cx="60" cy="40" r="1.2"/><circle class="s s2" cx="140" cy="210" r="1"/>
    <circle class="s s3" cx="230" cy="70" r="1.5"/><circle class="s" cx="320" cy="290" r="1"/>
    <circle class="s s2" cx="410" cy="30" r="1.1"/><circle class="s s3" cx="505" cy="250" r="1.4"/>
    <circle class="s" cx="590" cy="95" r="1"/><circle class="s s2" cx="660" cy="300" r="1.2"/>
    <circle class="s s3" cx="720" cy="50" r="1.6"/><circle class="s" cx="1050" cy="40" r="1.2"/>
    <circle class="s s2" cx="1130" cy="120" r="1"/><circle class="s s3" cx="1160" cy="270" r="1.5"/>
    <circle class="s" cx="1010" cy="300" r="1"/><circle class="s s2" cx="790" cy="270" r="1.1"/>
    <circle class="s s3" cx="35" cy="300" r="1.3"/><circle class="s" cx="470" cy="150" r="0.9"/>
    <circle class="s s2" cx="1180" cy="20" r="1"/><circle class="s s3" cx="860" cy="20" r="1"/>
  </g>

  <!-- shooting stars: each streak starts off-canvas top-right and falls down-left -->
  <g class="shoot" style="animation-delay:0s"><line x1="0" y1="0" x2="140" y2="-70" stroke="url(#tail)" stroke-width="2" stroke-linecap="round"/><circle r="2.2" fill="#e0f2fe"/></g>
  <g class="shoot" style="animation-delay:2.6s; --x:180px; --y:40px"><line x1="0" y1="0" x2="110" y2="-55" stroke="url(#tail)" stroke-width="1.6" stroke-linecap="round"/><circle r="1.8" fill="#e0f2fe"/></g>
  <g class="shoot" style="animation-delay:4.8s; --x:-120px; --y:90px"><line x1="0" y1="0" x2="160" y2="-80" stroke="url(#tail)" stroke-width="2.4" stroke-linecap="round"/><circle r="2.4" fill="#e0f2fe"/></g>
  <g class="shoot" style="animation-delay:6.9s; --x:60px; --y:-10px"><line x1="0" y1="0" x2="90" y2="-45" stroke="url(#tail)" stroke-width="1.4" stroke-linecap="round"/><circle r="1.6" fill="#e0f2fe"/></g>

  <!-- text -->
  <text x="70" y="128" class="mono">~/vippin $ whoami<tspan class="cur"> ▌</tspan></text>
  <text x="66" y="200" class="name">Vippin Antony P</text>
  <text x="70" y="245" class="role">FULL STACK · UI CRAFT · SAAS</text>
  <rect x="70" y="268" width="64" height="3" rx="1.5" fill="#22d3ee"/>
</svg>
